<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #f0f2f5, #e6ecf0);
    margin: 0;
}

.container {
    max-width: 420px;
    margin: 40px auto;
    background: #fff;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    text-align: center;
}

.logo {
    width: 90px;
    margin-bottom: 10px;
}

h1 {
    font-size: 18px;
    margin-bottom: 20px;
    color: #333;
}

label {
    font-size: 14px;
    font-weight: bold;
    color: #555;
}

select {
    width: 100%;
    padding: 12px;
    margin: 15px 0 25px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 14px;
}

.card {
    background: #fafafa;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
}

.price {
    font-weight: bold;
    color: #007bff;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #28a745;
    color: #fff;
    cursor: pointer;
}
</style>
</head>

function updateTarifs(){
let w=document.getElementById("wilaya-select").value;
if(tarifs[w]){
let d=tarifs[w][0],b=tarifs[w][1];
document.getElementById("dom").innerText=(d=="0"?"غير متوفر":d+" دج");
document.getElementById("bur").innerText=(b=="0"?"غير متوفر":b+" دج");
}
}

function copyTarifs(){
let w=document.getElementById("wilaya-select");
let name=w.options[w.selectedIndex].text;
let key=w.value;

if(!key){alert("اختر الولاية");return;}

let d=tarifs[key][0],b=tarifs[key][1];

let txt="📦 سعر التوصيل - "+name+"\n\n";
txt+="🏠 للمنزل: "+(d=="0"?"غير متوفر":d+" دج")+"\n";
txt+="🏢 للمكتب: "+(b=="0"?"غير متوفر":b+" دج");

navigator.clipboard.writeText(txt);
alert
}
