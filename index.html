            margin: 0;
        }

        .container {
            max-width: 420px;
            margin: 40px auto;
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        .logo {
            width: 90px;
            margin-bottom: 10px;
        }

            margin-bottom: 20px;
            color: #333;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }

        select {
            width: 100%;
            padding: 12px;
            margin: 15px 0 25px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
            outline: none;
        }

        .card {
            background: #fafafa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {

            color: #555;
        }

        .price {
            font-size: 16px;
            font-weight: bold;
            color: #007bff;

    </style>
</head>
