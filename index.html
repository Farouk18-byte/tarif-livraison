<!DOCTYPE html>
<html lang="fr" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarifs de Livraison</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #f0f2f5, #e6ecf0);
            margin: 0;
        }

        .container {
            max-width: 420px;
            margin: 40px auto;
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        .logo {
            width: 90px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }

        select {
            width: 100%;
            padding: 12px;
            margin: 15px 0 25px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        select:focus {
            border-color: #007bff;
        }

        .card {
            background: #fafafa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .card:hover {
            background: #f1f5ff;
        }

        .title {
            font-size: 14px;
            color: #555;
        }

        .price {
            font-size: 16px;
            font-weight: bold;
            color: #007bff;
        }

        .empty {
            color: #999;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="logo.png" class="logo">

        <h1>سعر التوصيل - ZR Express</h1>

        <label>اختر الولاية</label>

        <select id="wilaya-select" onchange="updateTarifs()">
            <option value="">-- اختر --</option>
            <option value="Adrar">أدرار</option>
            <option value="Chlef">الشلف</option>
            <option value="Laghouat">الأغواط</option>
            <option value="Batna">باتنة</option>
            <option value="Biskra">بسكرة</option>
            <option value="Béchar">بشار</option>
            <option value="Blida">البليدة</option>
            <option value="Tamanrasset">تمنراست</option>
            <option value="Tlemcen">تلمسان</option>
            <option value="Alger">الجزائر</option>
            <option value="Oran">وهران</option>
            <option value="El Bayadh">البيض</option>
        </select>

        <div class="card">
            <span class="title">التوصيل للمنزل</span>
            <span id="zr-domicile" class="price empty">-</span>
        </div>

        <div class="card">
            <span class="title">التوصيل للمكتب</span>
            <span id="zr-bureau" class="price empty">-</span>
        </div>

        <div class="footer">
            ZR Express Delivery Service
        </div>
    </div>

    <script>
        const tarifs = {
            "Adrar": {"zr_domicile": "1400", "zr_bureau": "1070"},
            "Chlef": {"zr_domicile": "850", "zr_bureau": "570"},
            "Laghouat": {"zr_domicile": "950", "zr_bureau": "670"},
            "Batna": {"zr_domicile": "850", "zr_bureau": "570"},
            "Biskra": {"zr_domicile": "950", "zr_bureau": "670"},
            "Béchar": {"zr_domicile": "1000", "zr_bureau": "720"},
            "Blida": {"zr_domicile": "800", "zr_bureau": "570"},
            "Tamanrasset": {"zr_domicile": "1700", "zr_bureau": "1270"},
            "Tlemcen": {"zr_domicile": "750", "zr_bureau": "570"},
            "Alger": {"zr_domicile": "650", "zr_bureau": "470"},
            "Oran": {"zr_domicile": "750", "zr_bureau": "570"},
            "El Bayadh": {"zr_domicile": "1200", "zr_bureau": "770"}
        };

        function updateTarifs() {
            const wilaya = document.getElementById("wilaya-select").value;

            if (wilaya && tarifs[wilaya]) {
                document.getElementById("zr-domicile").textContent = tarifs[wilaya]["zr_domicile"] + " دج";
                document.getElementById("zr-bureau").textContent = tarifs[wilaya]["zr_bureau"] + " دج";
            } else {
                document.getElementById("zr-domicile").textContent = "-";
                document.getElementById("zr-bureau").textContent = "-";
            }
        }
    </script>
</body>
</html>
